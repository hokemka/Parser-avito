[bot]
token = 123456789:REPLACE_WITH_BOT_TOKEN
admin_ids = 123456789
support_username = support
premium_emoji = true

[database]
path = data/bot.db

[avito]
engine = camoufox
headless = true
proxy =
profile_dir = data/browser_profile
locale = ru-RU
browser_os = windows
block_images = true
humanize = true
geoip = true
page_timeout = 45
chromium_path =
block_cooldown = 600
request_delay = 2.0
monitor_tick = 30
default_check_interval = 300
max_pages = 2
listings_per_search = 40
ai_candidates_per_search = 10

[ai]
api_key = REPLACE_WITH_1MIN_API_KEY
model = gpt-4o-mini
analyze_images = true
max_images = 3
timeout = 90

[payments]
stars_enabled = true
stars_rate = 1.6
cryptobot_enabled = false
cryptobot_token =
cryptobot_network = mainnet
cryptobot_currency_type = fiat
cryptobot_asset = USDT
usd_rate = 95

[limits]
free_searches = 3
default_min_rating = 6
